[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "liobench"
version = "0.1.0"
description = "LIO baselines, weakness analysis and learned fusion for the snow-pole drive"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "pyproj", "pyyaml", "scikit-learn", "torch"]

[project.scripts]
liobench = "liobench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
