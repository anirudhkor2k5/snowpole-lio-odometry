# GenZ-LIO (cocel-postech/GenZ-LIO @ c6c464d) for the Ouster OS2-128 + internal IMU.
# Starting point: the authors' OS-128 configuration for ENWIDE (same sensor family and
# /ouster/* topics). Changes: Trip068.json extrinsics, no terminal UI, no cloud output,
# map pruned beyond 300 m (mapping.map_range).
# Used by both the ROS node (ros/launch/genz_lio.launch) and the Python runner.

common:
    lidar_topic: "/ouster/points"
    imu_topic: "/ouster/imu"
    qos_depth: 1000

runtime:
    max_threads: 0

preprocess:
    lidar_type: ouster
    scan_line: 128
    scan_rate: 10
    blind_min: 2.0       # same vehicle-return cutoff as the other methods
    blind_max: 200.0
    point_filter_num: 1

mapping:
    max_iteration: 4
    down_sample_size: 0.4

    voxel_size: 1.0
    max_layer: 4
    layer_point_size: [5, 5, 5, 5, 5]
    planar_threshold: 0.01
    sigma_num: 3.0
    max_points_size: 100
    max_mature_points_size: 100
    map_range: 300.0      # authors use -1 (never prune) on short sequences; on this 10 km drive the
                          # map grows without bound (4 GB after 500 scans). 300 m = 2x det range.

    extrinsic_est_en: false
    extrinsic_t: [-0.006253, 0.011775, -0.007645]  # os_sensor origin in os_imu
    extrinsic_r: [1, 0, 0,
                  0, 1, 0,
                  0, 0, 1]

adaptive_voxelization:
    enable: true
    window_size: 5
    scale_threshold: 30.0
    setpoint_exponent: 2
    min_points: 1000
    max_points: 4000
    error_sensitivity: 0.1
    error_rate_sensitivity: 0.2
    p_gain_min: 5.0e-06
    p_gain_max: 5.0e-05
    d_gain_min: 5.0e-08
    d_gain_max: 5.0e-07

hybrid_metric:
    enable: true
    lambda_po: 0.05
    sigma_num: 3.0
    max_points_per_voxel: 128
    reduction_ratio: 4
    adaptive_threshold:
        initial_threshold: 0.5
        max_range_motion: 100.0

noise_model:
    ranging_cov: 0.04
    angle_cov: 0.1
    acc_cov: 0.2
    gyr_cov: 0.05
    b_acc_cov: 0.0043
    b_gyr_cov: 0.000266

publish:
    path_en: false
    scan_publish_en: false
    dense_publish_en: false
    scan_bodyframe_pub_en: false
    scan_semantic_publish_en: false
    voxel_map_en: false
    voxel_map_max_layer: 1

pcd_save:
    enable: false
    interval: -1
